vi_model:
  z_dim: 2
  epsilon_dim: 2
  hidden_dim: 128
  num_layers: 2
  device: cuda
  uniform: false
target:
  z_dim: 2
  epsilon_dim: 2
  bbox:
  - -5
  - 5
  - -5
  - 5
  baseline_path: baselines/exact/x_shaped_exact_100k.pt
seed: 43
cuda_visible_devices: '0'
use_cuda: true
runner_type: KSIVI
target_type: x_shaped
vi_model_type: ConditionalGaussian
train:
  epochs: 50000
  batch_size: 128
  vi:
    lr: 0.002
    var_lr: 0.001
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 25000
  ksivi:
    statistic: v
    kernel: gaussian
    detach_kernel: false
    log_p_reg: 0.0
  log:
    metric_log_freq: 0
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 5000
  sample:
    freq: 5000
    num: 10000
  plot:
    freq: 5000
    num: 10000
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-06
    dtype: float32
  jacobian_spectral:
    enabled: false
    num_samples: 128
output:
  results_dir: /root/ruivi/results/ksivi_x_shaped_evolution_20261006/learning_rates/lr2e-3
  tb_dir: /root/ruivi/tb_logs/ksivi_x_shaped_evolution_20261006/learning_rates/lr2e-3
config_path: /root/ruivi-runs/ksivi-x-shaped-evolution-20261006/configs/ksivi_x_shaped.yaml
device: cuda
target_config_path: configs/targets/x_shaped.yaml
vi_model_config_path: configs/vi_models/ConditionalGaussian.yaml

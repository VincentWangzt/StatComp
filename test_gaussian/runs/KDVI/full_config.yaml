vi_model:
  z_dim: 2
  epsilon_dim: 32
  hidden_dim: 256
  num_layers: 3
  activation: elu
  device: cuda
  uniform: false
  variance_parameterization: logstd
  log_std_min: -3.0
target:
  z_dim: 2
  epsilon_dim: 2
  bbox:
  - -5
  - 5
  - -35
  - 35
  baseline_path: baselines/exact/flat_gaussian_exact_100k.pt
seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: KDVI
target_type: flat_gaussian
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Eps32-ELU-LogStd.yaml
output:
  results_dir: results/test_gaussian
tracking:
  enabled: false
  campaign: test_gaussian
  run_name: kdvi_flat_gaussian_seed42
train:
  epochs: 2000
  batch_size: 128
  vi:
    lr: 0.002
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 1000
  kdvi:
    mcmc_type: sgld
    mcmc_steps: 5
    mcmc_step_size: 0.05
    kernel: laplace_l2
    fit_bandwidth_on: x
    step_size_schedule:
      type: coupled
  grad_clip: null
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 200
  checkpoint:
    enabled: false
    freq: 2000
  sample:
    freq: 2000
    num: 5000
  plot:
    freq: 2000
    num: 5000
  ema:
    enabled: false
metric:
  kl_ite:
    enabled: true
    num_samples: 3000
  w2:
    enabled: true
    num_samples: 3000
    num_projections: 300
  elbo:
    enabled: false
    batch_size: 128
    num_batches: 1
    num_z_samples: 100
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 1000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 5000
    sample_batch_size: 5000
    dim_chunk: 25
    ref_chunk: 500
    model_chunk: 20000
    min_bandwidth: 1.0e-06
    dtype: float32
  jacobian_spectral:
    enabled: false
    num_samples: 128
config_path: test_gaussian/configs/kdvi_flat_gaussian.yaml
device: cuda
target_config_path: configs/targets/flat_gaussian.yaml

[project]
name = "DIVI"
version = "0.1.0"
description = "Denoising Implicit Variational Inference research codebase"
requires-python = "==3.14.*"
dependencies = [
    "torch==2.9.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.2",
    "omegaconf==2.3.0",
    "tensorboard==2.20.0",
    "wandb==0.28.0",
    "plotly==6.8.0",
    "python-dotenv==1.2.2",
    "tqdm==4.67.1",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "PyYAML==6.0.3",
    "normflows==1.7.3",
    "protobuf==6.33.0",
    "ipykernel==7.1.0",
    "pymupdf==1.27.2.2",
    "ruff==0.15.7",
    "xlrd==2.0.2",
    "openpyxl==3.1.5",
    "scikit-learn==1.8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

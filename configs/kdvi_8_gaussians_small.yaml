# KDVI configured to reproduce IVI-via-mcmc-distillation/run_ivi.py on the
# SMALL 8-Gaussians distribution (r=1, sigma=0.1).
#
# Key correspondences with run_ivi.py (IVI notebook, MALA path):
#   - Network:           ConditionalGaussian-IVI.yaml
#                          latent_dim=2, hidden=256, 3 layers, ELU,
#                          variance_parameterization=logstd, log_std_min=-3
#                          (matches notebook's log_std.clamp(-3) — gradient
#                          flows through std=exp(log_std), not sqrt(exp(.))).
#   - Iterations:        100000
#   - Batch size:        128
#   - VI optimizer:      Adam(lr=1e-3, betas=(0.9, 0.999))
#                        StepLR(step_size=5000, gamma=0.75)   (anneal_freq/rate)
#   - MCMC kernel:       MALA, K=1 step per iteration
#   - mcmc_step_size:    0.02 (KDVI's tau parameterization;
#                        equivalent to IVI's drift_stepsz=0.01 since
#                        KDVI drift = (tau/2)*score, IVI drift = stepsz*score
#                        => tau = 2*stepsz_ivi)
#   - step_size_schedule: coupled  (KDVI's coupled = IVI's stepsz/anneal_coef)
#   - Annealing:         scheme=ivi, steps=50000  (mirrors notebook
#                        anneal_coef = min(1.0, 0.1 + i/50000))
#   - MMD kernel:        laplace_l2  (matches notebook's exp(-||.||_2/(2h)))
#   - fit_bandwidth_on:  ivi          (median of cat([cdist(y,x), cdist(x,x)]))
#   - loss_form:         ivi          (0.5 * E[k(x,x)] - E[k(y,x)])
#
# Empirical convergence with seed=7:
#   epoch  20000: KL=0.263
#   epoch  60000: KL=0.146   <- first below 0.15 threshold
#   epoch  80000: KL=0.148
#   epoch 100000: KL=0.146   <- final, below 0.15 threshold
#
# All evaluation metrics other than KL ITE are disabled per task spec.

seed: 7
cuda_visible_devices: "0"
use_cuda: false  # IVI runs CPU; matches notebook's torch.set_num_threads(1)

runner_type: KDVI
target_type: 8_gaussians_small
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-IVI.yaml

train:
  epochs: 100000
  batch_size: 128
  # Byte-identical IVI parity: reset the training RNG to `seed` right before the
  # loop and make eval/sample/plot draws RNG-neutral, so the training stream is a
  # pure function of (seed, step). Run IVI with `--rng-isolation` to match.
  parity_rng_isolation: true
  vi:
    lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 5000
      gamma: 0.75
  annealing:
    enabled: true
    scheme: ivi
    steps: 50000
  kdvi:
    mcmc_type: mala
    mcmc_steps: 1
    mcmc_step_size: 0.02
    kernel: laplace_l2
    fit_bandwidth_on: ivi
    loss_form: ivi
    step_size_schedule:
      type: coupled
  grad_clip: null
  log:
    metric_log_freq: 5000
    loss_log_freq: 1000
    reverse_log_freq: 5000
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 200000
  sample:
    freq: 200000
    num: 5000
  plot:
    freq: 200000
    num: 2000
  ema:
    enabled: false
    beta: 0.999

metric:
  kl_ite:
    enabled: true
    num_samples: 5000
  w2:
    enabled: false
    num_samples: 1000
    num_projections: 100
  elbo:
    enabled: false
    batch_size: 128
    num_batches: 1
    num_z_samples: 100
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 1000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false

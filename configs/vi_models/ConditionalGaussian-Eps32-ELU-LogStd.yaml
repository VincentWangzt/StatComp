# Conditional Gaussian with a 32-dimensional epsilon input, three 256-wide
# ELU hidden layers, and a log-standard-deviation output head.
z_dim: ${target.z_dim}
epsilon_dim: 32
hidden_dim: 256
num_layers: 3
activation: elu
device: ${device}
uniform: false
variance_parameterization: logstd
log_std_min: -3.0

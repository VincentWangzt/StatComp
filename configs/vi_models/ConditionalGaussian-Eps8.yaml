z_dim: ${target.z_dim}
# Wider latent (epsilon) dim than z_dim. Hard-coded literal so that
# base_runner.py:98 (which forces target.epsilon_dim = z_dim) does not
# reach back into this VI config.
epsilon_dim: 8
hidden_dim: 128
num_layers: 2
activation: silu
device: ${device}
uniform: false # Whether to use uniform prior over epsilon

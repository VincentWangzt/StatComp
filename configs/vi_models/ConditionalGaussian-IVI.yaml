# VI model matching the architecture of IVI-via-mcmc-distillation/run_ivi.py.
#   - latent_dim = 2 (notebook's `latent_dim=2`).
#   - 3 hidden layers of width 256 with ELU activations (notebook's `Transform`).
#   - Output split into (mean, log_std). std = exp(log_std), with
#     log_std clamped at log_std_min = -3 — matches notebook line 249:
#       log_std = log_std.clamp(log_std_min=-3)
#       samp_x = samp_x_raw * log_std.exp() + mean
#   - variance_parameterization=logstd: gradient flows through std=exp(log_std)
#     directly (NOT through std=sqrt(exp(log_var)) like the logvar option),
#     reproducing the gradient magnitude of the IVI implementation exactly.
#
# epsilon_dim is set to a literal here so that base_runner's
# target.epsilon_dim = z_dim override does not propagate into this config.
z_dim: ${target.z_dim}
epsilon_dim: 2
hidden_dim: 256
num_layers: 3
activation: elu
device: ${device}
uniform: false
variance_parameterization: logstd
log_std_min: -3.0

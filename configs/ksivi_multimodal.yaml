# KSIVI on Multimodal distribution
# Original: kernel=IMQ, epochs=500*100=50k, batch=500, lr=0.001, annealing=True
seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: KSIVI
target_type: multimodal
vi_model_type: ConditionalGaussianGlobal

vi_model:
  epsilon_dim: 3
  hidden_dim: 50
  num_layers: 2
  activation: relu
  variance_parameterization: logvar
  global_log_var_init: -1.3862943611198906
  global_log_var_min: -20

train:
  epochs: 50000
  batch_size: 500
  vi:
    lr: 1.0e-3
    var_lr: 1.0e-3
    betas: [0.9, 0.99]
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 25000
  ksivi:
    statistic: v
    kernel: imq
    detach_kernel: false
    log_p_reg: 0.0
  log:
    metric_log_freq: 500
    loss_log_freq: 100
    reverse_log_freq: 500
  checkpoint:
    enabled: true
    freq: 5000
  sample:
    freq: 500
    num: 100000
  plot:
    freq: 500
    num: 1000

metric:
  kl_ite:
    num_samples: 10000
  w2:
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 512
    num_batches: 1
    num_z_samples: 500
  ksd:
    enabled: true
    num_samples: 1000
  mmd:
    enabled: true
    num_samples: 1000

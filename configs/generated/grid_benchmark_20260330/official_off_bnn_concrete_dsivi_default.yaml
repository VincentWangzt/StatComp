seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: DSIVI
target_type: Bnn_concrete
vi_model_type: ConditionalGaussian
reverse_model_type: MLPDenoiseModel
reverse_model_config_path: configs/reverse_models/MLPDenoiseModel-Bnn-exp.yaml
train:
  epochs: 10000
  batch_size: 1024
  normalize_reverse_score: false
  vi:
    lr: 0.001
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.7
  reverse:
    lr: 0.002
    batch_size: 2048
    epochs: 2
    update_freq: 1
  annealing:
    enabled: false
    scheme: linear
    steps: 5000
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 1000
  sample:
    freq: 500
    num: 1000
  plot:
    freq: 500
    num: 1000
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 256
    num_batches: 2
    num_z_samples: 1024
  ksd:
    enabled: true
    num_samples: 1000
  bnn:
    num_samples: 500
    enabled: true
  mmd:
    enabled: false
    num_samples: 1000
  fisher:
    enabled: true
    num_samples: 1000
    num_is_samples: 512
resume:
  enabled: false
output:
  results_dir: results/grid_benchmark_20260330/official
  tb_dir: tb_logs/grid_benchmark_20260330/official
campaign:
  slug: grid_benchmark_20260330
  run_id: official_off_bnn_concrete_dsivi_default
  target: Bnn_concrete
  variant: dsivi_default
  annealing_mode: 'off'

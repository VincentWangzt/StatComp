seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: KSIVI
target_type: Bnn_concrete
vi_model_type: ConditionalGaussianGlobal
train:
  epochs: 100000
  batch_size: 100
  grad_clip: 1.0
  ema:
    enabled: true
    beta: 0.999
  vi:
    lr: 0.001
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.7
    var_lr: 0.001
  annealing:
    enabled: false
    scheme: linear
    steps: 5000
  ksivi:
    statistic: v
    kernel: gaussian
    detach_kernel: false
    log_p_reg: 1.0
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
  checkpoint:
    enabled: true
    freq: 5000
  sample:
    freq: 999999
    num: 100
  plot:
    freq: 999999
    num: 100
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 256
    num_batches: 2
    num_z_samples: 1024
  ksd:
    enabled: true
    num_samples: 1000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    num_samples: 500
    enabled: true
  fisher:
    enabled: true
    num_samples: 1000
    num_is_samples: 512
resume:
  enabled: false
output:
  results_dir: results/grid_benchmark_20260330/official
  tb_dir: tb_logs/grid_benchmark_20260330/official
campaign:
  slug: grid_benchmark_20260330

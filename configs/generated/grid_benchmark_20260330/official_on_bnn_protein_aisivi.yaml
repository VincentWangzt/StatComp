seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: AISIVI
target_type: Bnn_protein
vi_model_type: ConditionalGaussianGlobalUniform
reverse_model_type: ConditionalRealNVP
train:
  epochs: 10000
  batch_size: 100
  reverse_sample_num: 256
  vi:
    lr: 0.001
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.7
  reverse:
    lr: 5.0e-05
    batch_size: 100
    epochs: 1
    update_freq: 1
    weight_decay: 0.0
    scheduler:
      type: StepLR
      step_size: 5000
      gamma: 0.01
  annealing:
    enabled: true
    scheme: linear
    steps: 5000
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 1000
  sample:
    freq: 500
    num: 1000
  plot:
    freq: 500
    num: 1000
  grad_clip: 10.0
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 256
    num_batches: 2
    num_z_samples: 1024
  bnn:
    num_samples: 500
    enabled: true
  mmd:
    enabled: false
    num_samples: 1000
  ksd:
    enabled: true
    num_samples: 1000
  fisher:
    enabled: true
    num_samples: 1000
    num_is_samples: 512
resume:
  enabled: false
output:
  results_dir: results/grid_benchmark_20260330/official
  tb_dir: tb_logs/grid_benchmark_20260330/official
campaign:
  slug: grid_benchmark_20260330
  run_id: official_on_bnn_protein_aisivi
  target: Bnn_protein
  variant: aisivi
  annealing_mode: 'on'
vi_model_config_path: configs/vi_models/ConditionalGaussianGlobalUniform-Bnn-aisivi.yaml
reverse_model_config_path: configs/reverse_models/ConditionalRealNVP-AISIVI-Bnn.yaml

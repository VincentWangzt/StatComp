seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: DSIVI
target_type: Bnn_boston
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Bnn-ksivi.yaml
reverse_model_type: MLPDenoiseModel
reverse_model_config_path: configs/reverse_models/MLPDenoiseModel-Bnn-v3.yaml
reverse_model:
  warmup:
    epochs: 5000
    enabled: false
train:
  epochs: 2
  batch_size: 128
  grad_clip: 1.0
  pretrain:
    enabled: false
    steps: 100
    lr: 0.01
    batch_size: 100
  ema:
    enabled: true
    beta: 0.999
  vi:
    lr: 0.001
    var_lr: 0.001
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  reverse:
    lr: 0.001
    batch_size: 128
    epochs: 1
    update_freq: 1
  annealing:
    enabled: true
    scheme: linear
    steps: 10000
  log:
    metric_log_freq: 1
    loss_log_freq: 1
    reverse_log_freq: 1
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 999999
  sample:
    freq: 999999
    num: 64
  plot:
    freq: 999999
    num: 64
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: true
    num_samples: 16
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-06
    dtype: float32
campaign:
  slug: langevin_bnn_knob_grid_20260422
  run_id: smoke_dsivi_boston_bs128
  question: q4_dsivi_bnn_batch
  variant: dsivi_bs128
  target: Bnn_boston
  method: DSIVI
  smoke: true
resume:
  enabled: false
output:

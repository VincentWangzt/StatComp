seed: 42
cuda_visible_devices: '0'
use_cuda: true
runner_type: AISIVI
target_type: Langevin_post
vi_model_type: ConditionalGaussianGlobalUniform
vi_model_config_path: configs/vi_models/ConditionalGaussianGlobalUniform-AISIVI.yaml
reverse_model_type: ConditionalRealNVP
reverse_model_config_path: configs/reverse_models/ConditionalRealNVP-AISIVI-Langevin.yaml
train:
  epochs: 2
  batch_size: 128
  reverse_sample_num: 64
  grad_clip: 10.0
  vi:
    lr: 0.0002
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.7
  reverse:
    lr: 0.0002
    weight_decay: 0.0
    batch_size: 128
    epochs: 1
    update_freq: 1
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.1
  annealing:
    enabled: true
    scheme: linear
    steps: 5000
  log:
    metric_log_freq: 1
    loss_log_freq: 1
    reverse_log_freq: 1
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 999999
  sample:
    freq: 999999
    num: 64
  plot:
    freq: 999999
    num: 64
metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: true
    num_samples: 128
    num_projections: 16
  elbo:
    enabled: true
    batch_size: 32
    num_batches: 1
    num_z_samples: 64
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: true
    num_ref_samples: 64
    num_model_samples: 128
    sample_batch_size: 128
    dim_chunk: 25
    ref_chunk: 64
    model_chunk: 128
    min_bandwidth: 1.0e-06
    dtype: float32
campaign:
  slug: langevin_bnn_knob_grid_20260422
  run_id: smoke_aisivi_langevin_vi_default
  question: q1_aisivi_vi_model
  variant: aisivi_vi_default
  target: Langevin_post
  method: AISIVI
  smoke: true
resume:
  enabled: false
output:
  results_dir: /root/autodl-tmp/results/langevin_bnn_knob_grid_20260422/smoke
  tb_dir: /root/autodl-tmp/tb_logs/langevin_bnn_knob_grid_20260422/smoke

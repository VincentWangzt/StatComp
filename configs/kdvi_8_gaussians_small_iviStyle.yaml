# KDVI on small 8-gaussians, with K=1 MALA + Gaussian kernel,
# i.e. as close to the IVI notebook recipe as KDVI can get.
# This is an ablation to disentangle "is the gap from KDVI's
# K=10 SGLD + laplace_l2 recipe vs IVI's K=1 MALA + Gaussian?"
seed: 42
cuda_visible_devices: "0"
use_cuda: false

runner_type: KDVI
target_type: 8_gaussians_small
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Eps8.yaml

train:
  epochs: 100000
  batch_size: 128
  vi:
    lr: 1.0e-3
    var_lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 25000
  kdvi:
    mcmc_type: mala       # IVI uses MALA
    mcmc_steps: 1         # IVI uses K=1
    # IVI uses drift_stepsz=0.01 on the small ring (sigma=0.1).
    mcmc_step_size: 0.01
    hmc_leapfrog_steps: 10
    kernel: gaussian      # IVI uses an SVGD-style Gaussian
    fit_bandwidth_on: x   # adapt h on x only (more like the SVGD heuristic)
    step_size_schedule:
      type: coupled       # IVI also divides drift step by anneal coef
  grad_clip: 10.0
  log:
    metric_log_freq: 500
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 5000
  sample:
    freq: 5000
    num: 10000
  plot:
    freq: 5000
    num: 10000
  ema:
    enabled: false
    beta: 0.999

metric:
  kl_ite:
    enabled: true
    num_samples: 10000
  w2:
    enabled: true
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: true
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false

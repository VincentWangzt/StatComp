seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: SIVI
target_type: Bnn_boston
vi_model_type: ConditionalGaussian

train:
  epochs: 20000
  batch_size: 128
  reverse_sample_num: 4096
  vi:
    lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.7
  annealing:
    enabled: true
    scheme: linear
    steps: 5000
  log:
    metric_log_freq: 100
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 1000
  sample:
    freq: 500
    num: 1000
  plot:
    freq: 500
    num: 1000

metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 128
    num_batches: 5
    num_z_samples: 200
  bnn:
    num_samples: 500

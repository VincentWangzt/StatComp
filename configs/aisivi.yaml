# Global settings
# - `seed`: Random seed used for reproducibility across torch operations.
# - `cuda_visible_devices`: Comma-separated GPU indices exposed to the process.
# - `use_cuda`: Toggle GPU usage if CUDA is available.
seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: AISIVI
target_type: x_shaped
vi_model_type: ConditionalGaussian
reverse_model_type: ConditionalRealNVP

train:
  epochs: 3000
  batch_size: 128
  reverse_sample_num: 1024
  vi:
    lr: 5.0e-4
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.8
  reverse:
    lr: 1.0e-3
    batch_size: 8192
    epochs: 1
    update_freq: 1
    scheduler:
      type: StepLR
      step_size: 2000
      gamma: 0.1
  annealing:
    enabled: false
    scheme: linear
    steps: 1000
  log:
    metric_log_freq: 10
    loss_log_freq: 100
    reverse_log_freq: 500
    time_avg_window: 500
  checkpoint:
    enabled: true
    freq: 1000
  sample:
    freq: 500
    num: 10000
  plot:
    freq: 500
    num: 1000

metric:
  kl_ite:
    num_samples: 10000
  w2:
    num_samples: 10000
    num_projections: 1000
  elbo:
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  expected_log_marginal:
    enabled: true
    num_ref_samples: 1000
    num_model_samples: 5000
    sample_batch_size: 5000
    dim_chunk: 25
    ref_chunk: 500
    model_chunk: 20000
    min_bandwidth: 1.0e-6
    dtype: float32
  fisher:
    enabled: true
    num_samples: 1000
    num_is_samples: 512

resume:
  enabled: true
  ckpt_dir: results/UIVI/x_shaped/20260111_031534/checkpoints/epoch_3000
  load_optimizer: false
  no_override_epoch: false

campaign:
  slug: toy_scatter_grid
  manifest_path: campaigns/toy_scatter_grid/manifest.json
  output_dir: campaigns/toy_scatter_grid/generated_reports/finalization
  scratch_results_dir: results/toy_scatter_grid/finalization_scratch
  scratch_tb_dir: tb_logs/toy_scatter_grid/finalization_scratch

selection:
  seeds: [42, 44]
  methods: [SIVI, KSIVI, AISIVI, UIVI, DSIVI]
  evaluation_targets: [x_shaped, student_uc, 8_gaussians]
  scatter_targets: [x_shaped, student_uc, 8_gaussians]
  scatter_methods: [GroundTruth, SIVI, KSIVI, AISIVI, UIVI, DSIVI]
  seed_for_figures: 42
  seed_overrides:
    AISIVI: 44

modules:
  scatter_grid: true

evaluation:
  device: cpu
  fail_fast: true

plots:
  scatter:
    num_points: 2000
    figsize_per_panel: [2.25, 2.1]
    alpha: 0.45
    point_size: 3
    title_fontsize: 18
    label_fontsize: 18
    tick_fontsize: 14
    w_pad: 0.9
    h_pad: 0.35

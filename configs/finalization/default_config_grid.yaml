campaign:
  slug: default_config_grid
  manifest_path: campaigns/default_config_grid/manifest.json
  output_dir: campaigns/default_config_grid/generated_reports/finalization
  scratch_results_dir: results/default_config_grid/finalization_scratch
  scratch_tb_dir: tb_logs/default_config_grid/finalization_scratch

selection:
  seeds: auto
  methods: [SIVI, UIVI, AISIVI, DSIVI, KSIVI]
  evaluation_targets: [banana, multimodal, x_shaped, student_uc, 8_gaussians, Langevin_post]
  scatter_targets: [x_shaped, student_uc, 8_gaussians]
  scatter_methods: [GroundTruth, AISIVI, UIVI, DSIVI]
  bnn_targets: [Bnn_boston, Bnn_concrete, Bnn_power, Bnn_protein, Bnn_winered, Bnn_yacht]
  seed_for_figures: 42

modules:
  evaluate: true
  scatter_grid: true
  toy_tables: true
  toy_method_grid: true
  langevin_table: true
  student_edge_table: true
  langevin_trace_grid: true
  bnn_table: true

evaluation:
  device: auto
  overwrite: false
  fail_fast: true
  elbo:
    batch_size: 2048
    num_batches: 20
    num_z_samples: 5000
  w2:
    num_samples: 10000
    num_projections: 5000
  truncated_w2:
    enabled: true
    target_widths:
      8_gaussians: 6
      student_uc: 8
    accepted_samples: 10000
    sample_batch_size: 20000
    max_draws: 0
  student_uc_constrained_w2:
    enabled: true
    widths: [5, 8, 10]
    accepted_samples: 10000
    sample_batch_size: 20000
    max_draws: 0
  langevin_kde_elm:
    enabled: true
    num_ref_samples: 1000
    num_model_samples: 100000
    sample_batch_size: 10000
    dim_chunk: 25
    ref_chunk: 500
    model_chunk: 20000
    dtype: float32
    sgld:
      enabled: true
      reference_path: baselines/hmc/Langevin_post.pt
      model_path: baselines/hmc/Langevin_post_sgld_100k.pt
      seed: 0
  bnn:
    num_samples: 2000

plots:
  scatter:
    num_points: 2000
    figsize_per_panel: [2.25, 2.1]
    alpha: 0.45
    point_size: 3
    title_fontsize: 13
    label_fontsize: 13
    w_pad: 0.9
    h_pad: 0.35
  langevin_trace:
    num_samples: 10000
    figsize_per_panel: [3.2, 2.4]

tables:
  best_bold: true
  value_precision: 3
  se_precision: 2

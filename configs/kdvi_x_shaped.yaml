seed: 7
cuda_visible_devices: "0"
use_cuda: true

runner_type: KDVI
target_type: x_shaped
vi_model_type: ConditionalGaussian
vi_model_config_path: configs/vi_models/ConditionalGaussian-Eps32-ELU-LogStd.yaml

train:
  epochs: 100000
  batch_size: 1024
  vi:
    lr: 2.0e-3
    scheduler:
      type: StepLR
      step_size: 5000
      gamma: 0.75
  annealing:
    enabled: true
    scheme: linear
    steps: 50000
  kdvi:
    mcmc_type: sgld
    mcmc_steps: 5
    mcmc_step_size: 1.0e-1
    kernel: laplace_l2
    fit_bandwidth_on: x
    step_size_schedule:
      type: coupled
  grad_clip: null
  log:
    metric_log_freq: 5000
    loss_log_freq: 1000
    reverse_log_freq: 5000
    time_avg_window: 500
  checkpoint:
    enabled: false
    freq: 200000
  sample:
    freq: 200000
    num: 5000
  plot:
    freq: 10000
    num: 2000
  ema:
    enabled: false
    beta: 0.999

metric:
  kl_ite:
    enabled: true
    num_samples: 10000
  w2:
    enabled: true
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: true
    batch_size: 512
    num_batches: 10
    num_z_samples: 5000
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 2000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false
    num_ref_samples: 1000
    num_model_samples: 50000
    sample_batch_size: 50000
    dim_chunk: 50
    ref_chunk: 500
    model_chunk: 5000
    min_bandwidth: 1.0e-6
    dtype: float32

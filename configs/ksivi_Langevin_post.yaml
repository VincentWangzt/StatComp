# KSIVI on Langevin conditioned diffusion process (100-dimensional)
# Original: kernel=gaussian, epochs=1000*100=100k, batch=128, lr=0.0002, no annealing
seed: 42
cuda_visible_devices: "0"
use_cuda: true

runner_type: KSIVI
target_type: Langevin_post
vi_model_type: ConditionalGaussianGlobal

train:
  epochs: 100000
  batch_size: 128
  vi:
    lr: 2.0e-4
    scheduler:
      type: StepLR
      step_size: 10000
      gamma: 0.9
  annealing:
    enabled: false
    scheme: linear
    steps: 10000
  ksivi:
    statistic: v
    kernel: gaussian
    detach_kernel: false
    log_p_reg: 0.0
  log:
    metric_log_freq: 1000
    loss_log_freq: 500
    reverse_log_freq: 500
  checkpoint:
    enabled: true
    freq: 10000
  sample:
    freq: 1000
    num: 1000
  plot:
    freq: 1000
    num: 1000

metric:
  kl_ite:
    enabled: false
    num_samples: 10000
  w2:
    enabled: false
    num_samples: 10000
    num_projections: 1000
  elbo:
    enabled: false
    batch_size: 512
    num_batches: 5
    num_z_samples: 200
  ksd:
    enabled: true
    num_samples: 1000
  mmd:
    enabled: false

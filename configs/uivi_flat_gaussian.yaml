seed: 42
cuda_visible_devices: "0"
use_cuda: false

runner_type: UIVI
target_type: flat_gaussian
vi_model_type: ConditionalGaussian

train:
  epochs: 2000
  batch_size: 128
  reverse_sample_num: 5
  vi:
    lr: 1.0e-3
    scheduler:
      type: StepLR
      step_size: 1000
      gamma: 0.9
  annealing:
    enabled: true
    scheme: linear
    steps: 1000
  log:
    metric_log_freq: 2000
    loss_log_freq: 500
    reverse_log_freq: 2000
    time_avg_window: 200
  checkpoint:
    enabled: false
    freq: 100000
  sample:
    freq: 100000
    num: 2000
  plot:
    freq: 100000
    num: 2000

metric:
  kl_ite:
    enabled: true
    num_samples: 3000
  w2:
    enabled: true
    num_samples: 3000
    num_projections: 300
  elbo:
    enabled: false
    batch_size: 128
    num_batches: 1
    num_z_samples: 100
  fisher:
    enabled: false
    num_samples: 1000
    num_is_samples: 512
  ksd:
    enabled: false
    num_samples: 1000
  mmd:
    enabled: false
    num_samples: 1000
  bnn:
    enabled: false
    num_samples: 500
  expected_log_marginal:
    enabled: false
